# Pengaturan eksperimen sesuai rancangan yang dikunci (22–23 Okt 2026)

split:
  train: 0.70
  val: 0.10
  test: 0.20
seeds: [0, 1, 2, 3, 4]          # tiap seed = split baru + mask baru
seeds_pilot: [0, 1, 2]

missing:
  utama:
    mekanisme: MAR
    ratio: [0.0, 0.1, 0.2, 0.3, 0.4]
    p_obs: 0.3                  # proporsi kolom selalu teramati (0.1 jika ratio > 0.3)
    mekanisme_sekali_dari_train: true
  pembanding:
    mekanisme: MCAR
    ratio: [0.3]
  hanya_fitur: true             # y tidak pernah di-mask dan bukan pemicu MAR

diffusion:                      # default kode DiffPuter, kecuali disebut lain
  hid_dim: 1024
  lr: 1.0e-4
  batch_size: 4096
  max_epochs: 10000
  patience: 500
  num_steps: 50                 # M; uji 20 jika waktu terlalu lama
  resample_inner: 20            # loop dalam impute_mask; uji 5 bila memakai masking
  num_samples: 20               # N sampel di testing
  em_iter: 5                    # K
  em_iter_ablation: [1, 3, 5]

modifikasi:
  bobot_lambda: 5               # default awal; dipilih ulang di val
  bobot_lambda_grid: [1, 2, 5, 10]
  masking_p: 0.5
  masking_p_grid: [0.0, 0.25, 0.5, 0.75]
  stochastic_em: true
  stochastic_em_jumlah_sampel: 1   # 3 = Monte Carlo EM (opsional)

tuning:
  dataset: [california, bike]   # pilih λ dan p di val, lalu dipakai tetap
  seed: 0
  ratio: 0.3
  latih_ulang_train_plus_val: true

varian_ablation:
  diffputer_asli: {bobot: false, masking: false, sem: false}
  usulan_bobot:   {bobot: true,  masking: false, sem: false}
  usulan_masking: {bobot: false, masking: true,  sem: false}
  usulan_sem:     {bobot: false, masking: false, sem: true}
  usulan_lengkap: {bobot: true,  masking: true,  sem: true}

pilot:
  dataset: california
  ratio: [0.1, 0.4]
  varian: [diffputer_asli, usulan_masking, usulan_sem, usulan_lengkap]

evaluasi:
  akurasi: [rmse, mae, r2]
  ketidakpastian: [crps_fair, coverage, lebar_interval, rank_histogram]
  interval: persentil_5_95      # atau min_max (≈ 90,5% untuk N = 20)
  imputasi_pendukung: [rmse_fitur, rasio_std]
  qice_opsional: {N: 100, hanya_E7_subset: true}
